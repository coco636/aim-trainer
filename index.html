<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>三目标射击 · 瓦洛兰特式持枪练枪</title>
<style>
  :root{
    --bg1:#0b1220; --bg2:#111d30;
    --ink:#dbe7f5;
    --accent:#3df0a0;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family:"Segoe UI","Microsoft YaHei",system-ui,sans-serif;
    background:linear-gradient(var(--bg1),var(--bg2));
    color:var(--ink);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    min-height:100vh;padding:12px;
    user-select:none;-webkit-user-select:none;
    overflow:hidden;touch-action:manipulation;
  }
  .wrap{width:min(100%,940px);text-align:center;display:flex;flex-direction:column;height:100%;}

  h1{margin:2px 0 0;font-size:clamp(22px,5vw,34px);font-weight:800;letter-spacing:1px;}
  .sub{font-size:12.5px;opacity:.55;margin:2px 0 8px;}

  .hud{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;align-items:center;margin-bottom:8px;}
  .stat{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);border-radius:11px;padding:5px 13px;min-width:62px;}
  .stat .label{font-size:10.5px;opacity:.5;}
  .stat .val{font-size:19px;font-weight:700;color:#fff;font-variant-numeric:tabular-nums;}

  /* 灵敏度 */
  .sens{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);border-radius:11px;padding:6px 12px;display:flex;align-items:center;gap:8px;}
  .sens .lbl{font-size:11px;opacity:.65;}
  .sens input[type=range]{width:110px;accent-color:var(--accent);cursor:pointer;}
  .sens .v{font-size:13px;font-weight:700;color:var(--accent);min-width:38px;text-align:right;}

  /* 靶场 */
  .range{
    position:relative;flex:1;min-height:340px;border-radius:16px;overflow:hidden;
    background:
      radial-gradient(circle at 50% 45%,rgba(61,240,160,.06),rgba(0,0,0,0) 60%),
      linear-gradient(#15243b,#0c1526);
    box-shadow:inset 0 4px 20px rgba(0,0,0,.55),0 6px 0 rgba(0,0,0,.35);
    touch-action:none;
  }
  .range::before{
    content:"";position:absolute;inset:0;
    background-image:radial-gradient(circle,#243a5c 1.1px,transparent 1.2px);
    background-size:28px 28px;opacity:.45;pointer-events:none;
  }

  /* 蓝色小球 */
  .ball{
    position:absolute;width:52px;height:52px;transform:translate(-50%,-50%);
    border-radius:50%;pointer-events:none;z-index:3;
    background:radial-gradient(circle at 32% 28%, #a8d4ff 0%, #4d9eff 38%, #2b6fd6 68%, #1c4f9e 100%);
    box-shadow:0 5px 9px rgba(0,0,0,.5), inset -3px -4px 7px rgba(0,20,50,.45), inset 2px 2px 4px rgba(255,255,255,.35);
  }
  .ball.gold{
    background:radial-gradient(circle at 32% 28%, #ffe9a8 0%, #ffc23d 38%, #f59e1a 68%, #d07a08 100%);
    box-shadow:0 5px 10px rgba(255,170,0,.6), inset -3px -4px 7px rgba(90,40,0,.4), inset 2px 2px 4px rgba(255,255,255,.4);
  }
  .ball.flash{animation:blink .18s linear 3;}
  @keyframes blink{50%{opacity:.15;}}

  /* 准星（固定屏幕中心） */
  .crosshair{position:absolute;left:50%;top:50%;width:0;height:0;z-index:10;pointer-events:none;}
  .ch{position:absolute;background:var(--accent);box-shadow:0 0 3px var(--accent);}
  .ch.u{width:2px;height:9px;left:-1px;top:-17px;}
  .ch.d{width:2px;height:9px;left:-1px;top:8px;}
  .ch.l{width:9px;height:2px;top:-1px;left:-17px;}
  .ch.r{width:9px;height:2px;top:-1px;left:8px;}
  .ch.dot{width:3px;height:3px;left:-1.5px;top:-1.5px;border-radius:50%;}

  /* 枪（第一人称视角，底部中央） */
  .gun{
    position:absolute;left:50%;bottom:-6px;transform:translateX(-50%);
    width:200px;height:200px;z-index:9;pointer-events:none;
  }
  .gun svg{width:100%;height:100%;display:block;}
  .gun.recoil{animation:recoil .12s ease-out;}
  @keyframes recoil{0%{transform:translateX(-50%) translateY(0);}40%{transform:translateX(-50%) translateY(10px) rotate(1deg);}100%{transform:translateX(-50%) translateY(0);}}

  /* 枪口火光 */
  .muzzle{
    position:absolute;left:50%;top:50%;width:26px;height:26px;transform:translate(-50%,-38px);
    border-radius:50%;pointer-events:none;z-index:11;opacity:0;
    background:radial-gradient(circle,#fff7c0 0%,#ffc23d 40%,rgba(255,120,0,0) 75%);
  }
  .muzzle.show{animation:muzzle .08s ease-out;}
  @keyframes muzzle{0%{opacity:1;transform:translate(-50%,-38px) scale(.6);}100%{opacity:0;transform:translate(-50%,-60px) scale(1.5);}}

  /* 命中特效 */
  .fx{position:absolute;transform:translate(-50%,-50%);pointer-events:none;z-index:12;font-weight:800;color:#fff;font-size:24px;text-shadow:0 2px 4px rgba(0,0,0,.5);animation:pop .5s ease-out forwards;}
  @keyframes pop{0%{opacity:1;transform:translate(-50%,-50%) scale(.6);}100%{opacity:0;transform:translate(-50%,-180%) scale(1.25);}}
  .hitmark{position:absolute;transform:translate(-50%,-50%);pointer-events:none;z-index:12;width:24px;height:24px;animation:hitfade .25s ease-out forwards;}
  .hitmark::before,.hitmark::after{content:"";position:absolute;background:#ff5a3c;border-radius:2px;}
  .hitmark::before{left:0;top:10px;width:24px;height:3px;transform:rotate(45deg);}
  .hitmark::after{left:0;top:10px;width:24px;height:3px;transform:rotate(-45deg);}
  @keyframes hitfade{0%{opacity:1;transform:translate(-50%,-50%) scale(.7);}100%{opacity:0;transform:translate(-50%,-50%) scale(1.2);}}

  .btn{border:none;border-radius:14px;padding:12px 32px;margin-top:14px;font-size:16px;font-weight:700;color:#04120a;cursor:pointer;letter-spacing:1px;
    background:linear-gradient(#5cf0b0,#2bd18c);box-shadow:0 4px 0 #189a66,0 8px 14px rgba(0,0,0,.35);transition:transform .06s,box-shadow .06s;font-family:inherit;}
  .btn:active{transform:translateY(4px);box-shadow:0 1px 0 #189a66,0 4px 8px rgba(0,0,0,.35);}

  .overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(4,8,15,.72);backdrop-filter:blur(3px);z-index:30;padding:20px;}
  .overlay.hidden{display:none;}
  .panel{background:rgba(17,29,48,.97);border:1px solid rgba(255,255,255,.12);border-radius:22px;padding:26px 22px;text-align:center;width:min(100%,360px);box-shadow:0 12px 34px rgba(0,0,0,.55);}
  .panel h2{margin:6px 0 4px;font-size:24px;color:#fff;}
  .panel p{margin:6px 0;font-size:13px;opacity:.7;line-height:1.75;color:#cfe0f2;}
  .big{font-size:42px;font-weight:800;color:var(--accent);margin:4px 0;}
  .panel .btn{margin-top:12px;}
  .hint{font-size:11.5px;opacity:.5;margin-top:12px;}
  .stats2{display:flex;gap:8px;justify-content:center;margin-top:6px;}
  .stats2 .s{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:10px;padding:6px 12px;min-width:68px;}
  .stats2 .s .l{font-size:10.5px;opacity:.5;}
  .stats2 .s .v{font-size:17px;font-weight:700;color:#fff;}
  .sensitip{font-size:12px;color:#3df0a0;margin-top:8px;font-weight:600;}
</style>
</head>
<body>
<div class="wrap">
  <h1>🎯 三目标射击</h1>
  <div class="sub">瓦洛兰特式持枪 · 移动瞄准准星 · 三球练定位</div>

  <div class="hud">
    <div class="stat"><div class="label">命中</div><div class="val" id="hits">0</div></div>
    <div class="stat"><div class="label">时间</div><div class="val" id="time">60</div></div>
    <div class="stat"><div class="label">命中率</div><div class="val" id="acc">100%</div></div>
    <div class="stat"><div class="label">最高</div><div class="val" id="best">0</div></div>
    <div class="sens">
      <span class="lbl">灵敏度</span>
      <input type="range" id="sens" min="0.3" max="3" step="0.1" value="1">
      <span class="v" id="sensVal">1.0x</span>
    </div>
  </div>

  <div class="range" id="range">
    <div class="crosshair" id="crosshair">
      <div class="ch u"></div><div class="ch d"></div><div class="ch l"></div><div class="ch r"></div><div class="ch dot"></div>
    </div>
    <div class="muzzle" id="muzzle"></div>
    <div class="gun" id="gun">
      <svg viewBox="0 0 240 230" xmlns="http://www.w3.org/2000/svg">
        <rect x="108" y="8" width="24" height="6" rx="2" fill="#1a1d23"/>
        <rect x="112" y="14" width="16" height="128" rx="4" fill="#3a3f4a"/>
        <rect x="110" y="20" width="20" height="10" rx="2" fill="#2a2f38"/>
        <rect x="114" y="30" width="12" height="70" rx="3" fill="#454b57"/>
        <rect x="116" y="4" width="8" height="14" rx="2" fill="#4d525d"/>
        <path d="M86 142 L154 142 L170 230 L70 230 Z" fill="#2c313b"/>
        <path d="M96 142 L144 142 L156 230 L84 230 Z" fill="#3a3f4a"/>
        <path d="M108 142 L132 142 L140 230 L100 230 Z" fill="#31363f"/>
        <path d="M96 184 Q84 224 62 214 L74 182 Z" fill="#24272e"/>
        <path d="M112 158 Q118 184 128 158" stroke="#17191f" stroke-width="6" fill="none"/>
        <circle cx="120" cy="196" r="5" fill="#17191f"/>
      </svg>
    </div>
  </div>
</div>

<!-- 开始 -->
<div class="overlay" id="startOverlay">
  <div class="panel">
    <h2>三目标射击</h2>
    <p>屏幕上固定 <b>3 个蓝球</b>。<br>
    <b>移动鼠标 / 滑动屏幕</b>转动视角瞄准，<br>
    把蓝球移到屏幕中心准星，<b>点击开枪</b>。</p>
    <p style="opacity:.5;font-size:12px;">灵敏度可在顶部随时调节<br>（低灵敏度更稳，高灵敏度转得快）</p>
    <button class="btn" id="startBtn">开始练枪</button>
    <div class="hint">桌面：移动鼠标瞄准，点击开枪 · 手机：滑动转视角，点按开枪</div>
  </div>
</div>

<!-- 结束 -->
<div class="overlay hidden" id="endOverlay">
  <div class="panel">
    <h2 id="endTitle">练习结束</h2>
    <div class="big" id="finalScore">0</div>
    <p>本次命中数</p>
    <div class="stats2">
      <div class="s"><div class="l">命中率</div><div class="v" id="finalAcc">100%</div></div>
      <div class="s"><div class="l">漏靶</div><div class="v" id="finalMiss">0</div></div>
      <div class="s"><div class="l">开枪</div><div class="v" id="finalShot">0</div></div>
    </div>
    <p id="endMsg"></p>
    <div class="sensitip">本次灵敏度：<span id="endSens">1.0x</span></div>
    <button class="btn" id="againBtn">再来一局</button>
  </div>
</div>

<script>
(function(){
  var range = document.getElementById('range');
  var crosshair = document.getElementById('crosshair');
  var gun = document.getElementById('gun');
  var muzzle = document.getElementById('muzzle');
  var sensInput = document.getElementById('sens');
  var sensVal = document.getElementById('sensVal');
  var hitsEl = document.getElementById('hits');
  var timeEl = document.getElementById('time');
  var accEl = document.getElementById('acc');
  var bestEl = document.getElementById('best');
  var startOverlay = document.getElementById('startOverlay');
  var endOverlay = document.getElementById('endOverlay');
  var startBtn = document.getElementById('startBtn');
  var againBtn = document.getElementById('againBtn');
  var finalScoreEl = document.getElementById('finalScore');
  var finalAccEl = document.getElementById('finalAcc');
  var finalMissEl = document.getElementById('finalMiss');
  var finalShotEl = document.getElementById('finalShot');
  var endMsgEl = document.getElementById('endMsg');
  var endTitle = document.getElementById('endTitle');
  var endSens = document.getElementById('endSens');

  var GAME_TIME = 60;
  var TARGET_COUNT = 3;
  var hits = 0, shots = 0, missed = 0;
  var timeLeft = GAME_TIME;
  var playing = false, timer = null;
  var sensitivity = 1.0;
  var targets = [];
  var best = parseInt(localStorage.getItem('aim3_best')||'0',10)||0;
  bestEl.textContent = best;

  // 视角/世界
  var camX = 0, camY = 0;
  var worldW = 0, worldH = 0, W = 0, H = 0;

  // 音效
  var audioCtx = null;
  function ensureAudio(){
    if(!audioCtx){ try{ audioCtx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} }
    if(audioCtx && audioCtx.state==='suspended'){ audioCtx.resume(); }
  }
  function gunSound(){
    if(!audioCtx) return;
    var dur=0.08, buf=audioCtx.createBuffer(1,audioCtx.sampleRate*dur,audioCtx.sampleRate), d=buf.getChannelData(0);
    for(var i=0;i<d.length;i++){ d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,2.4); }
    var s=audioCtx.createBufferSource(); s.buffer=buf;
    var g=audioCtx.createGain(); g.gain.value=0.3; s.connect(g); g.connect(audioCtx.destination); s.start();
  }
  function hitSound(){
    if(!audioCtx) return;
    var o=audioCtx.createOscillator(), g=audioCtx.createGain();
    o.type='sine'; o.frequency.value=1200; g.gain.value=0.15;
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime+0.12);
    o.connect(g); g.connect(audioCtx.destination); o.start(); o.stop(audioCtx.currentTime+0.12);
  }

  function size(){
    var w = range.clientWidth || 600;
    return Math.max(46, Math.min(52, Math.round(w*0.085)));
  }
  function clamp(v,a,b){ return v<a?a:(v>b?b:v); }

  function render(){
    for(var i=0;i<targets.length;i++){
      var t=targets[i];
      t.el.style.left = (t.wx - camX)+'px';
      t.el.style.top = (t.wy - camY)+'px';
    }
  }
  function moveCamera(dx,dy){
    camX = clamp(camX + dx*sensitivity, 0, worldW-W);
    camY = clamp(camY + dy*sensitivity, 0, worldH-H);
    render();
  }

  function spawnBall(centerArea){
    var sz = size(), r = sz/2;
    var wx, wy;
    for(var a=0;a<120;a++){
      if(centerArea){
        wx = camX + r + Math.random()*(W-sz);
        wy = camY + r + Math.random()*(H-sz);
      }else{
        wx = r + Math.random()*(worldW-sz);
        wy = r + Math.random()*(worldH-sz);
      }
      // 世界内不重叠
      var ok=true;
      for(var i=0;i<targets.length;i++){
        var t=targets[i], dx=t.wx-wx, dy=t.wy-wy;
        if(dx*dx+dy*dy < (sz+10)*(sz+10)){ ok=false; break; }
      }
      if(ok){
        var el=document.createElement('div');
        var gold = Math.random()<0.08;
        el.className='ball'+(gold?' gold':'');
        el.style.width=sz+'px'; el.style.height=sz+'px';
        el.style.left=(wx-camX)+'px'; el.style.top=(wy-camY)+'px';
        range.appendChild(el);
        var t={el:el, wx:wx, wy:wy, gold:gold};
        t.timer=setTimeout(function(){ missTarget(t); }, gold?1600:2400);
        targets.push(t);
        return;
      }
    }
    // 兜底
    wx = r + Math.random()*(worldW-sz); wy = r + Math.random()*(worldH-sz);
    var el=document.createElement('div');
    el.className='ball'; el.style.width=sz+'px'; el.style.height=sz+'px';
    el.style.left=(wx-camX)+'px'; el.style.top=(wy-camY)+'px';
    range.appendChild(el);
    var t={el:el, wx:wx, wy:wy, gold:false};
    t.timer=setTimeout(function(){ missTarget(t); },2400);
    targets.push(t);
  }

  function missTarget(t){
    if(!playing) return;
    var idx=targets.indexOf(t); if(idx<0) return;
    targets.splice(idx,1); clearTimeout(t.timer);
    t.el.classList.add('flash');
    setTimeout(function(){ if(t.el.parentNode) t.el.parentNode.removeChild(t.el); },320);
    missed++;
    spawnBall(false);
  }

  function shoot(){
    if(!playing) return;
    ensureAudio();
    shots++;
    var sz=size(), r=sz/2;
    var cx=W/2, cy=H/2;
    var hit=null;
    for(var i=0;i<targets.length;i++){
      var t=targets[i];
      var sx=t.wx-camX, sy=t.wy-camY;
      if(Math.abs(sx-cx)<r+6 && Math.abs(sy-cy)<r+6){ hit=t; break; }
    }
    // 后坐力 + 火光
    gun.classList.remove('recoil'); void gun.offsetWidth; gun.classList.add('recoil');
    muzzle.classList.remove('show'); void muzzle.offsetWidth; muzzle.classList.add('show');
    gunSound();
    if(hit){
      var idx=targets.indexOf(hit);
      targets.splice(idx,1); clearTimeout(hit.timer);
      hits++; hitsEl.textContent=hits; updateAcc();
      // 命中叉（准星中心）
      var hm=document.createElement('div'); hm.className='hitmark'; hm.style.left=cx+'px'; hm.style.top=cy+'px';
      range.appendChild(hm); setTimeout(function(){ hm.remove(); },260);
      // 飘字（球位置）
      var fx=document.createElement('div'); fx.className='fx';
      fx.style.left=(hit.wx-camX)+'px'; fx.style.top=(hit.wy-camY)+'px';
      fx.textContent='+'+(hit.gold?3:1);
      range.appendChild(fx); setTimeout(function(){ fx.remove(); },500);
      hit.el.remove();
      hitSound();
      spawnBall(false);
    }else{
      updateAcc();
    }
  }
  function updateAcc(){
    accEl.textContent = shots>0 ? Math.round(hits/shots*100)+'%' : '100%';
  }

  // 灵敏度
  sensInput.addEventListener('input', function(){
    sensitivity = parseFloat(sensInput.value);
    sensVal.textContent = sensitivity.toFixed(1)+'x';
  });

  // 交互：桌面鼠标 + 移动端触摸
  var isTouch = ('ontouchstart' in window) && navigator.maxTouchPoints>0;
  if(!isTouch){
    var lastX=0, lastY=0;
    document.addEventListener('mousemove', function(e){
      if(!playing) return;
      if(lastX===0 && lastY===0){ lastX=e.clientX; lastY=e.clientY; return; }
      moveCamera(e.clientX-lastX, e.clientY-lastY);
      lastX=e.clientX; lastY=e.clientY;
    });
    range.addEventListener('mousedown', function(e){
      e.preventDefault();
      shoot();
    });
  }else{
    var tLastX=0, tLastY=0, tMoved=0;
    range.addEventListener('touchstart', function(e){
      if(!playing) return;
      var t=e.touches[0]; tLastX=t.clientX; tLastY=t.clientY; tMoved=0;
    }, {passive:false});
    range.addEventListener('touchmove', function(e){
      if(!playing) return;
      e.preventDefault();
      var t=e.touches[0];
      var dx=t.clientX-tLastX, dy=t.clientY-tLastY;
      moveCamera(dx,dy);
      tMoved += Math.abs(dx)+Math.abs(dy);
      tLastX=t.clientX; tLastY=t.clientY;
    }, {passive:false});
    range.addEventListener('touchend', function(e){
      if(!playing) return;
      if(tMoved < 12){ shoot(); }
    });
  }

  function tick(){ timeLeft--; timeEl.textContent=timeLeft; if(timeLeft<=0) endGame(); }
  function startGame(){
    ensureAudio();
    hits=0; shots=0; missed=0; timeLeft=GAME_TIME;
    hitsEl.textContent=0; timeEl.textContent=GAME_TIME; accEl.textContent='100%';
    targets.forEach(function(t){ clearTimeout(t.timer); });
    targets=[];
    range.querySelectorAll('.ball,.fx,.hitmark').forEach(function(n){ n.remove(); });
    // 计算世界与相机
    W = range.clientWidth; H = range.clientHeight;
    worldW = W*1.8; worldH = H*1.8;
    camX = (worldW-W)/2; camY = (worldH-H)/2;
    playing=true;
    startOverlay.classList.add('hidden');
    endOverlay.classList.add('hidden');
    timer=setInterval(tick,1000);
    for(var i=0;i<TARGET_COUNT;i++){ spawnBall(true); }
  }
  function endGame(){
    playing=false; clearInterval(timer);
    targets.forEach(function(t){ clearTimeout(t.timer); });
    targets=[];
    range.querySelectorAll('.ball').forEach(function(n){ n.remove(); });
    if(hits>best){ best=hits; localStorage.setItem('aim3_best',best); bestEl.textContent=best; }
    finalScoreEl.textContent=hits;
    finalAccEl.textContent = shots>0 ? Math.round(hits/shots*100)+'%' : '100%';
    finalMissEl.textContent=missed; finalShotEl.textContent=shots;
    endSens.textContent = sensitivity.toFixed(1)+'x';
    if(hits>best){ endTitle.textContent='新纪录！'; }
    if(hits>=50){ endMsgEl.textContent='枪法又快又准！'; }
    else if(hits>=35){ endMsgEl.textContent='定位手感不错，继续练命中率。'; }
    else if(hits>=22){ endMsgEl.textContent='把球移到准星中心再开枪，减少脱靶。'; }
    else{ endMsgEl.textContent='先熟悉灵敏度，转视角把球对准准星再点。'; }
    endOverlay.classList.remove('hidden');
  }

  startBtn.addEventListener('click', startGame);
  againBtn.addEventListener('click', startGame);
})();
</script>
</body>
</html>
