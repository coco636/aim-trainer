<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>三目标射击 · 瞄准定位练习</title>
<style>
  :root{
    --bg1:#0f1b2d; --bg2:#16263c;
    --ink:#eaf2fb;
    --card:rgba(255,255,255,.08);
    --accent:#4da3ff;
    --cross:#3df0a0;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family:"Segoe UI","Microsoft YaHei",system-ui,sans-serif;
    background:linear-gradient(var(--bg1),var(--bg2));
    color:var(--ink);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    min-height:100vh;padding:14px;
    user-select:none; -webkit-user-select:none;
    overflow:hidden; touch-action:manipulation;
  }
  .wrap{width:min(100%,920px);text-align:center;display:flex;flex-direction:column;height:100%;}

  h1{margin:4px 0 0;font-size:clamp(24px,5.5vw,38px);letter-spacing:1px;font-weight:800;}
  .sub{font-size:13px;opacity:.6;margin:2px 0 10px;}

  .hud{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:10px;align-items:center;}
  .stat{background:var(--card);border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:6px 14px;min-width:66px;}
  .stat .label{font-size:11px;opacity:.55;}
  .stat .val{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;color:#fff;}
  .sens{background:var(--card);border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:8px 13px;display:flex;align-items:center;gap:8px;}
  .sens .lbl{font-size:11px;opacity:.65;}
  .sens input[type=range]{width:110px;accent-color:var(--cross);cursor:pointer;}
  .sens .v{font-size:13px;font-weight:700;color:var(--cross);min-width:38px;text-align:right;font-variant-numeric:tabular-nums;}

  /* 靶场 */
  .range{
    position:relative;flex:1;min-height:340px;border-radius:18px;overflow:hidden;
    background:
      radial-gradient(circle at 50% 50%,rgba(77,163,255,.10),rgba(0,0,0,0) 65%),
      linear-gradient(#1b2c44,#101c2e);
    box-shadow:inset 0 4px 18px rgba(0,0,0,.5),0 6px 0 rgba(0,0,0,.3);
    cursor:none;
    touch-action:none;
  }
  .range::before{
    content:"";position:absolute;inset:0;
    background-image:radial-gradient(circle,#31476b 1.1px,transparent 1.2px);
    background-size:26px 26px;opacity:.5;pointer-events:none;
  }

  /* 准星（跟随鼠标，受灵敏度控制） */
  .crosshair{position:absolute;width:22px;height:22px;margin-left:-11px;margin-top:-11px;z-index:10;pointer-events:none;}
  .crosshair .cl{position:absolute;background:var(--cross);box-shadow:0 0 3px var(--cross);}
  .crosshair .cl.h{left:0;top:10px;width:22px;height:2px;}
  .crosshair .cl.v{left:10px;top:0;width:2px;height:22px;}
  .crosshair .dot{position:absolute;left:9px;top:9px;width:4px;height:4px;border-radius:50%;background:#fff;box-shadow:0 0 3px #fff;}

  /* 蓝色小球 */
  .target{
    position:absolute;width:56px;height:56px;transform:translate(-50%,-50%);
    pointer-events:none;
    animation:appear .15s ease-out;z-index:2;
  }
  .ball{
    width:100%;height:100%;border-radius:50%;
    background:radial-gradient(circle at 32% 28%, #a8d4ff 0%, #4d9eff 38%, #2b6fd6 68%, #1c4f9e 100%);
    box-shadow:0 5px 9px rgba(0,0,0,.45), inset -3px -4px 7px rgba(0,20,50,.45), inset 2px 2px 4px rgba(255,255,255,.35);
    transition:transform .05s;
  }
  .target.gold .ball{
    background:radial-gradient(circle at 32% 28%, #ffe9a8 0%, #ffc23d 38%, #f59e1a 68%, #d07a08 100%);
    box-shadow:0 5px 10px rgba(255,170,0,.55), inset -3px -4px 7px rgba(90,40,0,.4), inset 2px 2px 4px rgba(255,255,255,.4);
  }
  .target.flash .ball{animation:blink .18s linear 3;}
  .target.leaving{animation:leave .15s ease-in forwards;}
  @keyframes appear{0%{transform:translate(-50%,-50%) scale(0);}100%{transform:translate(-50%,-50%) scale(1);}}
  @keyframes leave{0%{transform:translate(-50%,-50%) scale(1);opacity:1;}100%{transform:translate(-50%,-50%) scale(.2);opacity:0;}}
  @keyframes blink{50%{opacity:.15;}}

  /* 命中特效 */
  .fx{
    position:absolute;transform:translate(-50%,-50%);pointer-events:none;z-index:5;
    font-weight:800;color:#fff;font-size:26px;
    text-shadow:0 2px 4px rgba(0,0,0,.5);
    animation:pop .55s ease-out forwards;
  }
  @keyframes pop{0%{opacity:1;transform:translate(-50%,-50%) scale(.6);}
    100%{opacity:0;transform:translate(-50%,-170%) scale(1.25);}}
  .hitmark{
    position:absolute;transform:translate(-50%,-50%);pointer-events:none;z-index:6;
    width:26px;height:26px;
    animation:hitfade .3s ease-out forwards;
  }
  .hitmark::before,.hitmark::after{content:"";position:absolute;background:#ff5a3c;border-radius:2px;}
  .hitmark::before{left:0;top:11px;width:26px;height:3px;transform:rotate(45deg);}
  .hitmark::after{left:0;top:11px;width:26px;height:3px;transform:rotate(-45deg);}
  @keyframes hitfade{0%{opacity:1;transform:translate(-50%,-50%) scale(.7);}100%{opacity:0;transform:translate(-50%,-50%) scale(1.2);}}

  .btn{border:none;border-radius:15px;padding:12px 32px;margin-top:14px;font-size:16px;font-weight:700;color:#fff;cursor:pointer;letter-spacing:1px;
    background:linear-gradient(#5ab0ff,#2b7de0);box-shadow:0 4px 0 #1b56a6,0 8px 14px rgba(0,0,0,.3);transition:transform .06s,box-shadow .06s;font-family:inherit;}
  .btn:active{transform:translateY(4px);box-shadow:0 1px 0 #1b56a6,0 4px 8px rgba(0,0,0,.3);}

  .overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    background:rgba(5,10,18,.65);backdrop-filter:blur(3px);z-index:30;padding:20px;}
  .overlay.hidden{display:none;}
  .panel{background:rgba(22,38,60,.96);border:1px solid rgba(255,255,255,.12);border-radius:22px;padding:28px 24px;text-align:center;width:min(100%,360px);box-shadow:0 12px 34px rgba(0,0,0,.5);}
  .panel h2{margin:8px 0 6px;font-size:25px;color:#fff;}
  .panel p{margin:6px 0;font-size:13.5px;opacity:.7;line-height:1.7;color:#cfe3f7;}
  .big{font-size:44px;font-weight:800;color:var(--accent);margin:4px 0;}
  .panel .btn{margin-top:12px;}
  .hint{font-size:12px;opacity:.5;margin-top:12px;}
  .ball-hero{width:84px;height:84px;margin:4px auto;border-radius:50%;
    background:radial-gradient(circle at 32% 28%, #a8d4ff 0%, #4d9eff 38%, #2b6fd6 68%, #1c4f9e 100%);
    box-shadow:0 8px 18px rgba(0,0,0,.5), inset -4px -5px 9px rgba(0,20,50,.45), inset 3px 3px 5px rgba(255,255,255,.35);}
  .stats2{display:flex;gap:8px;justify-content:center;margin-top:6px;}
  .stats2 .s{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:10px;padding:6px 12px;min-width:70px;}
  .stats2 .s .l{font-size:11px;opacity:.55;}
  .stats2 .s .v{font-size:18px;font-weight:700;color:#fff;}
</style>
</head>
<body>
<div class="wrap">
  <h1>🎯 三目标射击</h1>
  <div class="sub">60 秒 · 场上固定 3 个蓝球 · 打中补新 · 练瞄准定位</div>

  <div class="hud">
    <div class="stat"><div class="label">命中</div><div class="val" id="hits">0</div></div>
    <div class="stat"><div class="label">时间</div><div class="val" id="time">60</div></div>
    <div class="stat"><div class="label">命中率</div><div class="val" id="acc">100%</div></div>
    <div class="stat"><div class="label">最高</div><div class="val" id="best">0</div></div>
    <div class="sens">
      <span class="lbl">灵敏度</span>
      <input type="range" id="sens" min="0.3" max="3" step="0.1" value="1">
      <span class="v" id="sensVal">1.0x</span>
    </div>
  </div>

  <div class="range" id="range">
    <div class="crosshair" id="crosshair">
      <div class="cl h"></div><div class="cl v"></div><div class="dot"></div>
    </div>
  </div>
</div>

<!-- 开始 -->
<div class="overlay" id="startOverlay">
  <div class="panel">
    <div class="ball-hero"></div>
    <h2>三目标射击</h2>
    <p>场上固定 <b>3 个蓝球</b>，移动鼠标把<b>准星</b>对准球，点一下命中。<br>
    打中一个，新球立刻在别处出现。<br>
    球待久了会消失（漏靶），瞄准要快！</p>
    <p style="opacity:.5;font-size:12px;">灵敏度可在顶部随时调节：<br>调低更稳、调高更跟手</p>
    <button class="btn" id="startBtn">开始练习</button>
    <div class="hint">电脑：移动鼠标瞄准、点击开枪 · 手机：拖动准星、松手开枪</div>
  </div>
</div>

<!-- 结束 -->
<div class="overlay hidden" id="endOverlay">
  <div class="panel">
    <div class="ball-hero"></div>
    <h2 id="endTitle">练习结束</h2>
    <div class="big" id="finalScore">0</div>
    <p>本次命中数</p>
    <div class="stats2">
      <div class="s"><div class="l">命中率</div><div class="v" id="finalAcc">100%</div></div>
      <div class="s"><div class="l">漏靶</div><div class="v" id="finalMiss">0</div></div>
      <div class="s"><div class="l">开枪</div><div class="v" id="finalShot">0</div></div>
    </div>
    <p id="endMsg"></p>
    <div class="hint" id="endSens"></div>
    <button class="btn" id="againBtn">再来一局</button>
  </div>
</div>

<script>
(function(){
  var range = document.getElementById('range');
  var crossEl = document.getElementById('crosshair');
  var sensInput = document.getElementById('sens');
  var sensVal = document.getElementById('sensVal');
  var hitsEl = document.getElementById('hits');
  var timeEl = document.getElementById('time');
  var accEl = document.getElementById('acc');
  var bestEl = document.getElementById('best');
  var startOverlay = document.getElementById('startOverlay');
  var endOverlay = document.getElementById('endOverlay');
  var startBtn = document.getElementById('startBtn');
  var againBtn = document.getElementById('againBtn');
  var finalScoreEl = document.getElementById('finalScore');
  var finalAccEl = document.getElementById('finalAcc');
  var finalMissEl = document.getElementById('finalMiss');
  var finalShotEl = document.getElementById('finalShot');
  var endMsgEl = document.getElementById('endMsg');
  var endTitle = document.getElementById('endTitle');
  var endSens = document.getElementById('endSens');

  var GAME_TIME = 60;
  var TARGET_COUNT = 3;
  var hits = 0, shots = 0, missed = 0;
  var timeLeft = GAME_TIME;
  var playing = false, timer = null;
  var targets = [];
  var best = parseInt(localStorage.getItem('aim3_best')||'0',10)||0;
  bestEl.textContent = best;

  // 准星 + 灵敏度
  var sensitivity = 1.0;
  var crossX = 0, crossY = 0, W = 0, H = 0;

  var audioCtx = null;
  function ensureAudio(){
    if(!audioCtx){ try{ audioCtx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} }
    if(audioCtx && audioCtx.state==='suspended'){ audioCtx.resume(); }
  }
  function gunSound(){
    if(!audioCtx) return;
    var dur = 0.07;
    var buffer = audioCtx.createBuffer(1, audioCtx.sampleRate*dur, audioCtx.sampleRate);
    var d = buffer.getChannelData(0);
    for(var i=0;i<d.length;i++){ d[i] = (Math.random()*2-1) * Math.pow(1-i/d.length,2.2); }
    var src = audioCtx.createBufferSource(); src.buffer = buffer;
    var g = audioCtx.createGain(); g.gain.value = 0.28;
    src.connect(g); g.connect(audioCtx.destination); src.start();
  }
  function hitSound(){
    if(!audioCtx) return;
    var o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type='sine'; o.frequency.value=1180;
    g.gain.value=0.15; g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime+0.12);
    o.connect(g); g.connect(audioCtx.destination); o.start(); o.stop(audioCtx.currentTime+0.12);
  }

  function size(){
    var w = range.clientWidth || 600;
    return Math.max(46, Math.min(56, Math.round(w*0.09)));
  }
  function clamp(v,a,b){ return v<a?a:(v>b?b:v); }

  function placeCross(){
    crossEl.style.left = crossX+'px';
    crossEl.style.top = crossY+'px';
  }
  function moveCross(dx,dy){
    crossX = clamp(crossX + dx*sensitivity, 0, W);
    crossY = clamp(crossY + dy*sensitivity, 0, H);
    placeCross();
  }

  function randPos(sz){
    var WW = range.clientWidth, HH = range.clientHeight, m = 8;
    for(var a=0;a<120;a++){
      var x = sz/2 + Math.random()*(WW-sz);
      var y = sz/2 + Math.random()*(HH-sz);
      var ok = true;
      for(var i=0;i<targets.length;i++){
        var t = targets[i];
        var dx = t.x-x, dy = t.y-y;
        if(dx*dx+dy*dy < (sz+m)*(sz+m)){ ok=false; break; }
      }
      if(ok) return {x:x,y:y};
    }
    return {x: sz/2+Math.random()*(WW-sz), y: sz/2+Math.random()*(HH-sz)};
  }
  function stayDuration(){
    return Math.max(1000, 2300 - (GAME_TIME-timeLeft)*20);
  }
  function spawn(){
    if(!playing) return;
    var sz = size();
    var gold = Math.random() < 0.08;
    var pos = randPos(sz);
    var el = document.createElement('div');
    el.className = 'target' + (gold?' gold':'');
    el.style.left = pos.x+'px'; el.style.top = pos.y+'px';
    el.style.width = sz+'px'; el.style.height = sz+'px';
    el.innerHTML = '<div class="ball"></div>';
    range.appendChild(el);
    var t = {el:el, x:pos.x, y:pos.y, gold:gold};
    t.timer = setTimeout(function(){ missTarget(t); }, gold ? stayDuration()*0.6 : stayDuration());
    targets.push(t);
  }
  function missTarget(t){
    if(!playing) return;
    var idx = targets.indexOf(t);
    if(idx<0) return;
    targets.splice(idx,1);
    clearTimeout(t.timer);
    t.el.classList.add('flash');
    setTimeout(function(){ if(t.el.parentNode) t.el.parentNode.removeChild(t.el); }, 320);
    missed++;
    spawn();
  }
  function hitTarget(t, px, py){
    var idx = targets.indexOf(t);
    if(idx<0) return;
    targets.splice(idx,1);
    clearTimeout(t.timer);
    hits++; hitsEl.textContent = hits;
    updateAcc();
    var hm = document.createElement('div');
    hm.className='hitmark'; hm.style.left=px+'px'; hm.style.top=py+'px';
    range.appendChild(hm);
    setTimeout(function(){ hm.remove(); },300);
    var pts = t.gold ? 3 : 1;
    var fx = document.createElement('div');
    fx.className='fx'; fx.style.left=t.x+'px'; fx.style.top=t.y+'px';
    fx.textContent = '+' + pts;
    range.appendChild(fx);
    setTimeout(function(){ fx.remove(); },550);
    t.el.classList.add('leaving');
    setTimeout(function(){ if(t.el.parentNode) t.el.parentNode.removeChild(t.el); },150);
    hitSound();
    spawn();
  }
  function shoot(){
    shots++;
    var sz = size(), r = sz/2;
    var hit = null;
    for(var i=0;i<targets.length;i++){
      var t = targets[i];
      var dx = t.x-crossX, dy = t.y-crossY;
      if(dx*dx+dy*dy < (r+8)*(r+8)){ hit=t; break; }
    }
    gunSound();
    if(hit){
      hitTarget(hit, crossX, crossY);
    }else{
      updateAcc();
      var hm = document.createElement('div');
      hm.className='hitmark'; hm.style.left=crossX+'px'; hm.style.top=crossY+'px';
      hm.style.filter='grayscale(1) opacity(.5)';
      range.appendChild(hm);
      setTimeout(function(){ hm.remove(); },300);
    }
  }
  function updateAcc(){
    accEl.textContent = shots>0 ? Math.round(hits/shots*100)+'%' : '100%';
  }

  // 灵敏度
  sensInput.addEventListener('input', function(){
    sensitivity = parseFloat(sensInput.value);
    sensVal.textContent = sensitivity.toFixed(1)+'x';
  });

  // 交互
  var isTouch = ('ontouchstart' in window) && navigator.maxTouchPoints>0;
  if(isTouch){
    var tLastX=0, tLastY=0;
    range.addEventListener('touchstart', function(e){
      if(!playing) return;
      ensureAudio();
      var t=e.touches[0]; tLastX=t.clientX; tLastY=t.clientY;
      e.preventDefault();
    }, {passive:false});
    range.addEventListener('touchmove', function(e){
      if(!playing) return;
      e.preventDefault();
      var t=e.touches[0];
      moveCross(t.clientX-tLastX, t.clientY-tLastY);
      tLastX=t.clientX; tLastY=t.clientY;
    }, {passive:false});
    range.addEventListener('touchend', function(e){
      if(!playing) return;
      e.preventDefault();
      shoot();
    });
  }else{
    var mLastX=null, mLastY=null;
    document.addEventListener('mousemove', function(e){
      if(!playing) return;
      if(mLastX===null){ mLastX=e.clientX; mLastY=e.clientY; return; }
      moveCross(e.clientX-mLastX, e.clientY-mLastY);
      mLastX=e.clientX; mLastY=e.clientY;
    });
    range.addEventListener('mousedown', function(e){
      if(!playing) return;
      e.preventDefault();
      ensureAudio();
      shoot();
    });
  }

  function tick(){
    timeLeft--; timeEl.textContent = timeLeft;
    if(timeLeft<=0) endGame();
  }
  function startGame(){
    ensureAudio();
    hits=0; shots=0; missed=0; timeLeft=GAME_TIME;
    hitsEl.textContent=0; timeEl.textContent=GAME_TIME; accEl.textContent='100%';
    range.querySelectorAll('.target,.fx,.hitmark').forEach(function(n){ n.remove(); });
    targets=[];
    W = range.clientWidth; H = range.clientHeight;
    crossX = W/2; crossY = H/2;
    placeCross();
    playing=true;
    startOverlay.classList.add('hidden');
    endOverlay.classList.add('hidden');
    timer=setInterval(tick,1000);
    for(var i=0;i<TARGET_COUNT;i++){ spawn(); }
  }
  function endGame(){
    playing=false;
    clearInterval(timer);
    targets.forEach(function(t){ clearTimeout(t.timer); });
    targets=[];
    range.querySelectorAll('.target').forEach(function(n){ n.remove(); });
    if(hits>best){ best=hits; localStorage.setItem('aim3_best',best); bestEl.textContent=best; }
    finalScoreEl.textContent=hits;
    finalAccEl.textContent = shots>0 ? Math.round(hits/shots*100)+'%' : '100%';
    finalMissEl.textContent = missed;
    finalShotEl.textContent = shots;
    endSens.textContent = '本次灵敏度：' + sensitivity.toFixed(1)+'x';
    if(hits>best){ endTitle.textContent='新纪录！'; }
    if(hits>=45){ endMsgEl.textContent='又快又准，接近满中！'; }
    else if(hits>=30){ endMsgEl.textContent='定位手感不错，继续刷命中率！'; }
    else if(hits>=18){ endMsgEl.textContent='稳一点，先瞄准再点，减少脱靶。'; }
    else{ endMsgEl.textContent='别急着点，看清球的位置再开枪。'; }
    endOverlay.classList.remove('hidden');
  }

  startBtn.addEventListener('click', startGame);
  againBtn.addEventListener('click', startGame);
})();
</script>
</body>
</html>
